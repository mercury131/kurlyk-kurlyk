# securegate: SSTP VPN + MTProxy (telemt) + chat server + TURN + demo site on one domain / port 443,
# + alternative MTProxy implementations (mtprotoproxy, teleproxy) on their own ports with the same
# users, + WireGuard VPN (UDP). Clients: ./sgctl wg add <name>
# Usage:  cp .env.example .env  &&  edit .env  &&  docker compose up -d --build
name: securegate

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  gateway:
    build: ./gateway
    image: securegate-gateway:local
    container_name: securegate-gateway
    # host network: pppd creates ppp* interfaces on the host, NAT for VPN clients,
    # TURN UDP relay ports, real client IPs for the protection layer.
    network_mode: host
    # needed for pppd (/dev/ppp), iptables/nftables (NAT + bans) and net.ipv4.ip_forward
    privileged: true
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
      USERS_FILE: /config/users.yml
      MTPROXY_CONFIG_DIR: /data/mtproxy
    volumes:
      - ./data:/data
      - ./config:/config:ro
      - /lib/modules:/lib/modules:ro
    logging: *logging

  mtproxy:
    build: ./mtproxy
    image: securegate-mtproxy:local
    container_name: securegate-mtproxy
    network_mode: host
    restart: unless-stopped
    depends_on:
      - gateway
    volumes:
      - ./data/mtproxy:/etc/telemt
    logging: *logging

  # alternative MTProxy #2 (Python, alexbers/mtprotoproxy): public port MTPROTOPROXY_PORT (2053),
  # users = MTPROXY_USERS; config.py is generated by the gateway in data/mtproxy/mtprotoproxy/
  mtprotoproxy:
    build: ./mtprotoproxy
    image: securegate-mtprotoproxy:local
    container_name: securegate-mtprotoproxy
    network_mode: host
    restart: unless-stopped
    depends_on:
      - gateway
    volumes:
      - ./data/mtproxy/mtprotoproxy:/etc/mtprotoproxy
    logging: *logging

  # alternative MTProxy #3 (C, teleproxy - maintained fork of the official Telegram MTProxy):
  # public port TELEPROXY_PORT (2083), users = MTPROXY_USERS; args generated by the gateway
  teleproxy:
    build: ./teleproxy
    image: securegate-teleproxy:local
    container_name: securegate-teleproxy
    network_mode: host
    restart: unless-stopped
    depends_on:
      - gateway
    volumes:
      - ./data/mtproxy/teleproxy:/etc/teleproxy
    logging: *logging

  # WireGuard VPN: UDP WG_PORT (51820). Keys and clients persist in ./data/wireguard.
  # Add a client (prints a QR code for the phone):  ./sgctl wg add <name>
  wireguard:
    build: ./wireguard
    image: securegate-wireguard:local
    container_name: securegate-wireguard
    # host network + privileged: wg interface, NAT/forwarding rules, ip_forward on the host
    network_mode: host
    privileged: true
    restart: unless-stopped
    env_file: .env
    environment:
      WG_DIR: /data/wireguard
    volumes:
      - ./data/wireguard:/data/wireguard
      - /lib/modules:/lib/modules:ro
    stop_grace_period: 15s
    logging: *logging
